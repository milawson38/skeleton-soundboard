<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🦴 Skeleton Soundboard</title>
<style>
  :root{ --bg:#0a0710; --ink:#f3e9ff; --muted:#9a86b8; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:radial-gradient(1000px 700px at 50% -5%, #1e1030, var(--bg) 60%);
    color:var(--ink); font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    display:flex; flex-direction:column; height:100%; overflow:hidden; padding:env(safe-area-inset-top) 0 0}
  header{text-align:center; padding:10px 12px 2px}
  header h1{margin:0; font-size:20px; letter-spacing:.5px}
  #now{min-height:3.4em; margin:6px 16px 2px; text-align:center; color:#e9dcff; font-size:clamp(16px,4.5vw,22px);
    display:flex; align-items:center; justify-content:center; text-shadow:0 2px 16px rgba(0,0,0,.6)}
  #now .skull{display:inline-block; margin-right:8px}
  #now.playing .skull{animation:bob .9s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-6px) scale(1.12)}}
  #grid{flex:1; display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:12px 16px 8px}
  .tier{position:relative; border:0; border-radius:22px; color:#140c04; font-weight:800; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    font-size:clamp(17px,4.6vw,24px); line-height:1.1; text-align:center; padding:10px;
    box-shadow:0 10px 30px rgba(0,0,0,.4); transition:transform .08s, filter .15s; user-select:none}
  .tier:active{transform:scale(.96); filter:brightness(1.1)}
  .tier .em{font-size:clamp(40px,12vw,64px); line-height:1}
  .tier .sub{font-size:13px; font-weight:600; opacity:.75}
  .t-under5{background:linear-gradient(180deg,#ffd27a,#f2a93c)}
  .t-5to10 {background:linear-gradient(180deg,#ff9a4d,#e7651b)}
  .t-11to15{background:linear-gradient(180deg,#b07bff,#7a36e0); color:#fff}
  .t-teens {background:linear-gradient(180deg,#4fd1a0,#1f9e73); color:#06231a}
  /* which button is currently playing */
  .tier .badge{position:absolute; top:8px; right:10px; font-size:12px; font-weight:800;
    background:rgba(0,0,0,.30); color:#fff; border-radius:999px; padding:3px 10px; opacity:0; transition:opacity .15s}
  .tier.active .badge{opacity:1; animation:blink 1s step-start infinite}
  @keyframes blink{50%{opacity:.4}}
  .tier.active{filter:brightness(1.08); animation:glow 1.1s ease-in-out infinite}
  @keyframes glow{0%,100%{box-shadow:0 10px 30px rgba(0,0,0,.4), 0 0 0 0 rgba(255,255,255,0)}
    50%{box-shadow:0 10px 30px rgba(0,0,0,.4), 0 0 0 7px rgba(255,255,255,.30)}}
  /* skit transports (one row per clip) */
  #skitbar{display:flex; flex-direction:column; gap:8px; padding:0 16px 8px}
  .skit{display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background:linear-gradient(180deg,#3a2550,#241338); color:#f3e9ff; border:1px solid #4a3368;
    border-radius:16px; padding:12px 14px; font-size:15px; font-weight:700; cursor:pointer; user-select:none}
  .skit .ic{font-size:20px; line-height:1; width:1.2em; text-align:center; flex:none}
  .skit .lbl{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .skit.playing{background:linear-gradient(180deg,#5a2f7a,#3a1d5c); border-color:#8a5bd0;
    animation:glow 1.1s ease-in-out infinite}
  .skit:active{filter:brightness(1.2)}
  #bar{display:flex; gap:10px; justify-content:center; padding:0 16px calc(10px + env(safe-area-inset-bottom))}
  #bar button{background:#241a38; color:var(--ink); border:1px solid #3a2a52; border-radius:12px;
    padding:10px 16px; font-size:15px; font-weight:600; cursor:pointer}
  #bar button:active{filter:brightness(1.2)}
  #err{color:#ff8a8a; text-align:center; font-size:13px; min-height:1em}
</style>
</head>
<body>
<header><h1>🦴 Skeleton Soundboard</h1></header>
<div id="now"><span class="skull">🏚️</span><span id="nowtext">tap an age to make the skeleton talk</span></div>
<div id="err"></div>
<div id="grid">
  <button class="tier t-under5" data-tier="under5"><span class="badge">▶ playing</span><span class="em">👶</span>Little Kids<span class="sub">under 5 · gentle</span></button>
  <button class="tier t-5to10"  data-tier="5to10"><span class="badge">▶ playing</span><span class="em">🎃</span>Kids<span class="sub">5 – 10 · goofy</span></button>
  <button class="tier t-11to15" data-tier="11to15"><span class="badge">▶ playing</span><span class="em">😎</span>Tweens<span class="sub">11 – 15 · sassy</span></button>
  <button class="tier t-teens"  data-tier="teens"><span class="badge">▶ playing</span><span class="em">🧑</span>Teens<span class="sub">roast mode</span></button>
</div>
<div id="skitbar"></div>
<div id="bar">
  <button id="again">↻ Same again</button>
  <button id="stop">■ Stop all</button>
</div>

<script>
"use strict";
const BASE="";  // relative: works at any static-host path
const player=new Audio();
const now=document.getElementById("now"), nowtext=document.getElementById("nowtext"), err=document.getElementById("err");
const skitbar=document.getElementById("skitbar");
const IDLE="tap an age to make the skeleton talk";
let manifest={}, lastIdx={}, lastTier=null;
let mode=null;        // "clip" | <skitId> | null
let activeBtn=null;   // the tier button currently lit
let skits=[];         // [{id,f,t}]
let pos={}, dur={};   // per-skit resume position + duration (seconds)
let skitBtns={};      // skitId -> button element

function fmt(s){ s=Math.max(0,Math.floor(s||0)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function isSkit(m){ return skits.some(s=>s.id===m); }
function media(s){ // lock-screen controls + tells iOS this is a media session (helps playback continue when the screen locks)
  if(!("mediaSession" in navigator)) return;
  try{
    navigator.mediaSession.metadata=new MediaMetadata({title:s.t, artist:"🦴 Skeleton Soundboard"});
    navigator.mediaSession.setActionHandler("play",()=>toggleSkit(s.id));
    navigator.mediaSession.setActionHandler("pause",()=>toggleSkit(s.id));
    navigator.mediaSession.setActionHandler("stop",stopAll);
  }catch(e){}
}

fetch(BASE+"manifest.json").then(r=>r.json()).then(m=>{
  manifest=m; skits=Array.isArray(m.skits)?m.skits:[];
  buildSkitBar();
  // background prefetch so taps are instant (clip tiers only — skits stream on demand)
  for(const tier in m){ if(!Array.isArray(m[tier])||tier==="skits") continue; for(const it of m[tier]) fetch(BASE+it.f).catch(()=>{}); }
}).catch(e=>{ err.textContent="couldn't load clips — is the server running? ("+e+")"; });

function buildSkitBar(){
  skitbar.innerHTML=""; skitBtns={};
  for(const s of skits){
    const b=document.createElement("button");
    b.className="skit"; b.dataset.sid=s.id;
    b.innerHTML='<span class="ic">▶</span><span class="lbl"></span>';
    b.addEventListener("click",()=>toggleSkit(s.id));
    skitbar.appendChild(b); skitBtns[s.id]=b;
  }
  setSkitUi();
}
function setSkitUi(){
  for(const s of skits){
    const b=skitBtns[s.id]; if(!b) continue;
    const playing=(mode===s.id && !player.paused), d=dur[s.id]||0, p=pos[s.id]||0;
    b.classList.toggle("playing", playing);
    b.querySelector(".ic").textContent = playing ? "⏸" : "▶";
    let lbl=s.t+(s.loop?"  ·  loops 🔁":"");
    if(playing)   lbl=s.t+(s.loop?" 🔁":"")+"  ·  "+fmt(player.currentTime)+(d?" / "+fmt(d):"");
    else if(p>0)  lbl=s.t+"  ·  "+fmt(p)+(d?" / "+fmt(d):"")+"  (resume)";
    b.querySelector(".lbl").textContent=lbl;
  }
}
function clearActiveTier(){ if(activeBtn){ activeBtn.classList.remove("active"); activeBtn=null; } }
function stashSkit(){ if(isSkit(mode) && !player.ended) pos[mode]=player.currentTime; }

// ---- tier clips ----
function pick(tier){
  const pool=manifest[tier]||[]; if(!pool.length){ err.textContent="no clips for "+tier; return; }
  let i=Math.floor(Math.random()*pool.length);
  if(pool.length>1 && i===lastIdx[tier]) i=(i+1)%pool.length;
  lastIdx[tier]=i; lastTier=tier;
  playClip(pool[i], document.querySelector('.tier[data-tier="'+tier+'"]'));
}
function playClip(item, btn){
  err.textContent=""; stashSkit(); mode="clip"; setSkitUi(); player.loop=false;
  clearActiveTier(); if(btn){ btn.classList.add("active"); activeBtn=btn; }
  nowtext.textContent=item.t; now.classList.add("playing");
  player.src=BASE+item.f;
  player.play().catch(e=>{ err.textContent="tap again to play ("+e.name+")"; now.classList.remove("playing"); clearActiveTier(); });
}

// ---- skit transport (play / pause / resume per clip) ----
function toggleSkit(sid){
  const s=skits.find(x=>x.id===sid); if(!s) return;
  if(mode===sid && !player.paused){ player.pause(); pos[sid]=player.currentTime; setSkitUi(); return; } // pause
  stashSkit(); clearActiveTier();                                   // leaving a tier clip or another skit
  if(mode!==sid){ player.src=BASE+s.f; player.currentTime=pos[sid]||0; } // start or resume this one
  player.loop=!!s.loop;                                             // full skit loops as ambient filler (native loop → survives screen-lock)
  mode=sid; err.textContent=""; nowtext.textContent=s.t; now.classList.add("playing"); media(s);
  player.play().then(setSkitUi)
    .catch(e=>{ err.textContent="tap again to play ("+e.name+")"; now.classList.remove("playing"); setSkitUi(); });
}

// ---- global stop (stops + resets everything) ----
function stopAll(){
  player.pause(); try{ player.currentTime=0; }catch(e){}
  pos={}; mode=null; now.classList.remove("playing"); clearActiveTier(); setSkitUi(); nowtext.textContent=IDLE;
}

player.addEventListener("loadedmetadata",()=>{ if(isSkit(mode)){ dur[mode]=player.duration; setSkitUi(); } });
player.addEventListener("timeupdate",()=>{ if(isSkit(mode) && !player.paused) setSkitUi(); });
player.addEventListener("ended",()=>{
  now.classList.remove("playing"); clearActiveTier();
  if(isSkit(mode)){ pos[mode]=0; mode=null; setSkitUi(); nowtext.textContent=IDLE; }
});

document.querySelectorAll(".tier").forEach(b=> b.addEventListener("click",()=>pick(b.dataset.tier)));
document.getElementById("again").addEventListener("click",()=>{
  if(lastTier!=null && lastIdx[lastTier]!=null)
    playClip(manifest[lastTier][lastIdx[lastTier]], document.querySelector('.tier[data-tier="'+lastTier+'"]'));
});
document.getElementById("stop").addEventListener("click",stopAll);
</script>
</body>
</html>
